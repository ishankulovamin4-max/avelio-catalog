<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101112">
  <meta name="color-scheme" content="dark">
  <title>Avelio — каталог</title>
  <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css?v=df341311">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="app.js?v=cae37b2c"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="brand-row">
        <a class="brand" href="#/" data-route="#/" aria-label="Avelio — на главную">Avelio</a>
        <button class="back-button" id="back" type="button" hidden>
          <span aria-hidden="true">←</span> Назад
        </button>
        <a class="cart-link" href="#/cart" data-route="#/cart" data-cart-link="true">Корзина</a>
      </div>

      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="search">Поиск по каталогу</label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5"></circle>
          <path d="m15.5 15.5 5 5"></path>
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Название, код или размер"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
          disabled
        >
        <button class="icon-button search-clear" id="search-clear" type="button"
          aria-label="Очистить поиск" hidden>×</button>
      </form>
    </header>

    <main id="main" tabindex="-1">
      <section class="state-panel" role="status">
        <p class="eyebrow">Avelio</p>
        <h1>Открываем каталог</h1>
        <p class="muted">Мебель для вашего дома.</p>
      </section>
    </main>

    <footer class="cart-footer" id="cart-footer" aria-label="Запрос цены" hidden></footer>

    <noscript>
      <p class="noscript">Чтобы открыть каталог, разрешите JavaScript в браузере.</p>
    </noscript>
  </div>

  <dialog class="item-dialog" id="item-dialog" aria-labelledby="item-title"></dialog>
  <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
</body>
</html>
